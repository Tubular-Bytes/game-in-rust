[package]
name = "building-game"
version = "0.1.0"
edition = "2024"

[dependencies]
ctrlc2 = { version = "3.7.0", features = ["async"] }
futures-util = "0.3.31"
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["full"] }
tokio-tungstenite = { version = "0.27.0", features = ["handshake"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter", "json"] }
tracing-opentelemetry = "0.24.0"
opentelemetry = "0.23.0"
opentelemetry_sdk = { version = "0.23.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.16.0", features = ["http-proto", "reqwest-client", "grpc-tonic"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }

[profile.release]
strip = "debuginfo"
